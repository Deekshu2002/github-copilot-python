<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="controls controls-top">
    <label for="difficulty-select" class="difficulty-label">Difficulty:</label>
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <span id="difficulty-display" class="difficulty-display">Current: Easy</span>
  </div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint-solution">Hint</button>
    <span id="hint-count" class="hint-count">Hints: 0</span>
    <span id="timer-display" class="timer-display">Time: 00:00</span>
    <span id="message"></span>
  </div>
  <div class="scoreboard-panel">
    <h2>Scoreboard</h2>
    <ul id="scoreboard-list"></ul>
  </div>
  <div id="cell-feedback" class="sr-only">Conflicting values are highlighted and announced for screen readers.</div>
  <script src="/static/sudoku_validation.js"></script>
  <script src="/static/timer.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
